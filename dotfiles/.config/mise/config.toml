[bootstrap.hooks]
post-packages = """
TARGET_USER="${SUDO_USER:-${USER:-$(id -un 2>/dev/null || whoami)}}"
TARGET_HOME="$(getent passwd "${TARGET_USER}" 2>/dev/null | cut -d: -f6)"
[ -z "$TARGET_HOME" ] && TARGET_HOME="${HOME:-}"

if command -v sudo >/dev/null 2>&1; then
    sudo groupadd -f docker
    if ! groups "$TARGET_USER" 2>/dev/null | grep -q '\\bdocker\\b'; then
        sudo usermod -aG docker "$TARGET_USER" 2>/dev/null || true
    fi
fi

# Ensure ~/.docker/config.json exists with rootless context & credentials helper
mkdir -p "$TARGET_HOME/.docker"
if [ ! -f "$TARGET_HOME/.docker/config.json" ]; then
    cat <<'EOF' > "$TARGET_HOME/.docker/config.json"
{
    "auths": {
        "tcr.trioptima.net": {}
    },
    "credsStore": "secretservice",
    "currentContext": "rootless"
}
EOF
fi

# Ensure docker-credential-secretservice is available in PATH
if ! command -v docker-credential-secretservice >/dev/null 2>&1; then
    CRED_BIN="$TARGET_HOME/.local/bin/docker-credential-secretservice"
    mkdir -p "$TARGET_HOME/.local/bin"
    curl -fsSL "https://github.com/docker/docker-credential-helpers/releases/download/v0.9.3/docker-credential-secretservice-v0.9.3.linux-amd64" \
        -o "$CRED_BIN" 2>/dev/null || true
    chmod +x "$CRED_BIN" 2>/dev/null || true
fi

# Setup rootless docker service if setuptool is installed
if command -v dockerd-rootless-setuptool.sh >/dev/null 2>&1 && [ ! -f "$TARGET_HOME/.config/systemd/user/docker.service" ]; then
    dockerd-rootless-setuptool.sh install --force 2>/dev/null || true
fi
if command -v systemctl >/dev/null 2>&1; then
    systemctl --user enable --now docker 2>/dev/null || true
fi

if [ -d "$TARGET_HOME/.docker" ] && command -v sudo >/dev/null 2>&1; then
    sudo chown -R "$TARGET_USER:$TARGET_USER" "$TARGET_HOME/.docker" 2>/dev/null || true
    sudo chmod -R g+rwx "$TARGET_HOME/.docker" 2>/dev/null || true
fi
"""
pre-repos = """
if [ ! -d "$HOME/.oh-my-zsh" ]; then
    RUNZSH=no KEEP_ZSHRC=yes sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended --keep-zshrc
fi
"""
pre-dotfiles = """
if [ ! -f "$HOME/.gitconfig.local" ]; then
    NAME="$(git config --global user.name 2>/dev/null || echo "User")"
    EMAIL="$(git config --global user.email 2>/dev/null || echo "user@example.com")"
    cat <<EOF > "$HOME/.gitconfig.local"
[user]
	name = ${NAME}
	email = ${EMAIL}

[url "ssh://git@stash.trioptima.net:7999"]
	insteadOf = https://stash.trioptima.net/scm
EOF
fi
touch "$HOME/.zshrc.local"
"""

