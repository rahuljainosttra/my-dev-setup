[tasks.fonts]
description = "Install MesloLGS NF fonts (Powerlevel10k recommended)"
run = """
FONTS_DIR="${HOME}/.local/share/fonts/NerdFonts"
mkdir -p "${FONTS_DIR}"

# MesloLGS NF (Powerlevel10k recommended)
MESLO_URL="https://github.com/romkatv/powerlevel10k-media/raw/master"
for f in "MesloLGS NF Regular.ttf" "MesloLGS NF Bold.ttf" "MesloLGS NF Italic.ttf" "MesloLGS NF Bold Italic.ttf"; do
    if [ ! -f "${FONTS_DIR}/${f}" ]; then
        curl -fsSL "${MESLO_URL}/$(echo "$f" | sed 's/ /%20/g')" -o "${FONTS_DIR}/${f}" 2>/dev/null || true
    fi
done

# Refresh font cache
if command -v fc-cache >/dev/null 2>&1; then
    fc-cache -f "${FONTS_DIR}" >/dev/null 2>&1 || true
fi
"""

[tasks.bootstrap]
description = "Install fonts and run post-bootstrap tasks"
depends = ["fonts"]
run = "echo 'Workstation bootstrap finished successfully!'"

[settings.python]
github_attestations = false
